<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMasters</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Source+Sans+3&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="HRMasters">
        <p>Pessoas em primeiro lugar, dados no lugar certo.</p>
    </header>

    <main>
        <section>
            <h2>Cadastro de funcionário</h2>
            <form id="formulario">
                <input type="text" name="nome" placeholder="Nome completo" required>
                <input type="email" name="email" placeholder="E-mail" required>
                <input type="tel" name="telefone" placeholder="Telefone" required>
                <input type="text" name="cargo" placeholder="Cargo" required>
                <select name="departamento" required>
                    <option value="">Departamento</option>
                    <option>Administrativo</option>
                    <option>Financeiro</option>
                    <option>Recursos Humanos</option>
                    <option>Tecnologia</option>
                </select>
                <input type="number" name="salario" placeholder="Salário" min="0" required>
                <button type="submit" id="botao">Cadastrar</button>
            </form>
        </section>

        <section>
            <h2>Funcionários</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Cargo</th>
                        <th>Departamento</th>
                        <th>Salário</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
